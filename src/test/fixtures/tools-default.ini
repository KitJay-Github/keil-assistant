; Trimmed copy of the [ARM] section of a real MDK 5.36 TOOLS.INI.
; License, book and uninstall entries were removed; everything else is verbatim
; and used by the keilInstall / viewData / panel tests.
[UV2]
ARMSEL=1
TOOL_VARIANT=mdk_std

[ARM]
PATH="C:\Keil_v5\ARM\"
VERSION=5.36
PATH1="C:\Program Files (x86)\GNU Arm Embedded Toolchain\10 2020-q4-major\"
TOOLPREFIX=arm-none-eabi-
CPUDLL0=SARM.DLL(TDRV16,TDRV17,TDRV18)    # Drivers for ARM7/9 devices
